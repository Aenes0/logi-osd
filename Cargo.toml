[package]
name = "logi-osd"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/Aenes0/logi-osd"
license = "GPL-3.0-only"
description = "Avisos na tela (OSD) para teclados e mouses Logitech no COSMIC"

[dependencies]
smithay-client-toolkit = { version = "0.20.0", default-features = false, features = ["calloop"] }
tiny-skia = { version = "0.11.4", default-features = false, features = ["std", "simd"] }
ab_glyph = "0.2.32"
udev = "0.9.3"
rustix = { version = "1", features = ["event", "fs", "mm"] }
libc = "0.2"

[profile.release]
opt-level = 3
panic = "abort"
lto = "thin"
strip = true
codegen-units = 1

[dev-dependencies]
tiny-skia = { version = "0.11.4", default-features = false, features = ["std", "simd", "png-format"] }
